<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title>Register farmers and map farms</title>
  <desc>Turmi field-agent onboarding and satellite-supported farm mapping illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E8F5EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B2F21" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0B2F21; }
      .phase { font: 700 22px Arial, sans-serif; fill: #2F7D4A; letter-spacing: 1px; }
      .label { font: 700 27px Arial, sans-serif; fill: #0B2F21; }
      .body { font: 400 18px Arial, sans-serif; fill: #466255; }
      .small { font: 600 16px Arial, sans-serif; fill: #2F7D4A; }
      .line { stroke: #2F7D4A; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thin { stroke: #7DB88D; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .card { fill: #FFFFFF; stroke: #D7EBDD; stroke-width: 2; }
      .accent { fill: #DDF1E3; }
      .dark { fill: #0B2F21; }
      .green { fill: #2F7D4A; }
      .gold { fill: #E4B84F; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>

  <text x="70" y="82" class="phase">PHASES 1–2</text>
  <text x="70" y="132" class="title">Register farmers and map farms</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="500" height="430" rx="30" class="card"/>
    <rect x="630" y="185" width="500" height="430" rx="30" class="card"/>
  </g>

  <!-- registration -->
  <circle cx="215" cy="330" r="72" class="accent"/>
  <circle cx="215" cy="292" r="27" class="green"/>
  <path d="M160 386c8-44 102-44 110 0" class="line"/>
  <rect x="325" y="255" width="150" height="190" rx="20" fill="#F8FCF9" stroke="#7DB88D" stroke-width="4"/>
  <circle cx="400" cy="410" r="8" class="green"/>
  <path d="M350 295h100M350 330h80M350 365h95" class="thin"/>
  <circle cx="505" cy="245" r="34" class="dark"/>
  <path d="M488 245l12 12 23-27" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="500" class="label">Farmer onboarding</text>
  <text x="110" y="538" class="body">KYC, consent and structured</text>
  <text x="110" y="566" class="body">farmer and farm records.</text>

  <!-- mapping -->
  <rect x="705" y="245" width="350" height="220" rx="24" fill="#F8FCF9" stroke="#7DB88D" stroke-width="4"/>
  <path d="M740 405l85-110 90 55 100-80" class="thin"/>
  <path d="M755 285l95 40 80-55 95 50" class="thin"/>
  <path d="M760 420L800 290 920 320 1000 405 900 440z" fill="#DDF1E3" stroke="#2F7D4A" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="935" cy="335" r="20" class="gold"/>
  <path d="M935 315c-18 0-32 14-32 32 0 25 32 58 32 58s32-33 32-58c0-18-14-32-32-32z" fill="#0B2F21"/>
  <circle cx="935" cy="347" r="10" fill="#FFFFFF"/>
  <text x="685" y="500" class="label">Plot mapping</text>
  <text x="685" y="538" class="body">Satellite-supported boundaries,</text>
  <text x="685" y="566" class="body">crop and production information.</text>
</svg>