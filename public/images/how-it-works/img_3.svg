<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title>Record activities and verify production</title>
  <desc>Field activity records and satellite-based production milestone verification illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E8F5EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B2F21" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0B2F21; }
      .phase { font: 700 22px Arial, sans-serif; fill: #2F7D4A; letter-spacing: 1px; }
      .label { font: 700 27px Arial, sans-serif; fill: #0B2F21; }
      .body { font: 400 18px Arial, sans-serif; fill: #466255; }
      .small { font: 600 16px Arial, sans-serif; fill: #2F7D4A; }
      .line { stroke: #2F7D4A; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thin { stroke: #7DB88D; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .card { fill: #FFFFFF; stroke: #D7EBDD; stroke-width: 2; }
      .accent { fill: #DDF1E3; }
      .dark { fill: #0B2F21; }
      .green { fill: #2F7D4A; }
      .gold { fill: #E4B84F; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>

  <text x="70" y="82" class="phase">PHASES 5–6</text>
  <text x="70" y="132" class="title">Record activities and verify production</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="500" height="430" rx="30" class="card"/>
    <rect x="630" y="185" width="500" height="430" rx="30" class="card"/>
  </g>

  <!-- timeline -->
  <path d="M160 290v185" class="line"/>
  <circle cx="160" cy="305" r="18" class="gold"/>
  <circle cx="160" cy="380" r="18" class="green"/>
  <circle cx="160" cy="455" r="18" class="dark"/>
  <rect x="215" y="260" width="270" height="65" rx="16" class="accent"/>
  <rect x="215" y="347" width="270" height="65" rx="16" class="accent"/>
  <rect x="215" y="434" width="270" height="65" rx="16" class="accent"/>
  <text x="240" y="301" class="small">Land preparation</text>
  <text x="240" y="388" class="small">Crop development</text>
  <text x="240" y="475" class="small">Harvest progress</text>
  <text x="110" y="550" class="label">Field activity timeline</text>
  <text x="110" y="586" class="body">Human ground truth for every plot.</text>

  <!-- satellite verification -->
  <path d="M870 250l70 45-45 70-70-45z" fill="#FFFFFF" stroke="#2F7D4A" stroke-width="7"/>
  <path d="M850 265l-35-35M925 350l35 35M915 275l35-35M840 340l-35 35" class="line"/>
  <path d="M815 420c55-50 160-50 215 0" class="thin"/>
  <path d="M850 445c35-30 110-30 145 0" class="thin"/>
  <rect x="735" y="470" width="330" height="70" rx="20" fill="#0B2F21"/>
  <text x="775" y="512" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">T1 → T2 → T3</text>
  <text x="730" y="575" class="label">Production verification</text>
  <text x="730" y="608" class="body">Plowing, crop health, yield and harvest.</text>
</svg>