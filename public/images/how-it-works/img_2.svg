<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title>Define financing and deliver services</title>
  <desc>Plot-level financing requirements and in-kind agricultural service delivery illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E8F5EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B2F21" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0B2F21; }
      .phase { font: 700 22px Arial, sans-serif; fill: #2F7D4A; letter-spacing: 1px; }
      .label { font: 700 27px Arial, sans-serif; fill: #0B2F21; }
      .body { font: 400 18px Arial, sans-serif; fill: #466255; }
      .small { font: 600 16px Arial, sans-serif; fill: #2F7D4A; }
      .line { stroke: #2F7D4A; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thin { stroke: #7DB88D; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .card { fill: #FFFFFF; stroke: #D7EBDD; stroke-width: 2; }
      .accent { fill: #DDF1E3; }
      .dark { fill: #0B2F21; }
      .green { fill: #2F7D4A; }
      .gold { fill: #E4B84F; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>

  <text x="70" y="82" class="phase">PHASES 3–4</text>
  <text x="70" y="132" class="title">Define financing and deliver services</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="500" height="430" rx="30" class="card"/>
    <rect x="630" y="185" width="500" height="430" rx="30" class="card"/>
  </g>

  <!-- financing -->
  <rect x="135" y="240" width="250" height="240" rx="24" fill="#F8FCF9" stroke="#7DB88D" stroke-width="4"/>
  <path d="M180 295h160M180 340h120M180 385h145" class="thin"/>
  <circle cx="425" cy="320" r="75" class="accent"/>
  <path d="M425 270v100M392 295h50c20 0 20 30 0 30h-34c-20 0-20 30 0 30h50" class="line"/>
  <circle cx="470" cy="430" r="34" class="gold"/>
  <path d="M458 430l10 10 19-22" stroke="#0B2F21" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="520" class="label">Plot-level requirements</text>
  <text x="110" y="558" class="body">Inputs, services, logistics and</text>
  <text x="110" y="586" class="body">contract-farming requirements.</text>

  <!-- delivery -->
  <path d="M705 395h280l-35-90h-120v90" fill="#DDF1E3" stroke="#2F7D4A" stroke-width="7" stroke-linejoin="round"/>
  <rect x="720" y="330" width="115" height="65" rx="8" fill="#FFFFFF" stroke="#2F7D4A" stroke-width="6"/>
  <circle cx="780" cy="420" r="34" class="dark"/>
  <circle cx="930" cy="420" r="34" class="dark"/>
  <circle cx="780" cy="420" r="13" fill="#FFFFFF"/>
  <circle cx="930" cy="420" r="13" fill="#FFFFFF"/>
  <rect x="880" y="245" width="95" height="75" rx="10" fill="#E4B84F" stroke="#0B2F21" stroke-width="5"/>
  <path d="M900 245v75M955 245v75" stroke="#0B2F21" stroke-width="4"/>
  <path d="M1020 285h55M1055 265l20 20-20 20" class="line"/>
  <text x="685" y="500" class="label">In-kind delivery</text>
  <text x="685" y="538" class="body">Approved inputs and services are</text>
  <text x="685" y="566" class="body">procured, delivered and recorded.</text>
</svg>